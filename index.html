<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>東SSビル 6階 レイアウト</title>
<style>
:root{
  --bg:#f4f3ef;--panel:#ffffff;--ink:#1c2024;--muted:#5d646b;--faint:#8a9096;
  --line:#dddad3;--line-strong:#c3c0b8;--hover:#f2f1ec;--selected:#ecf1f8;--accent:#2457a6;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  --radius:6px;--shadow:0 1px 3px rgba(0,0,0,.10),0 4px 14px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* The 3D stage fills the page; everything else is a light layer on top of it. */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
.top{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
.top .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.ctl-label{font-size:12px;color:var(--muted)}

/* Segmented controls (radio inputs inside labels). */
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:32px;padding:0 12px;cursor:pointer;white-space:nowrap;border-left:1px solid var(--line)}
.seg label:first-child{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:hover{background:var(--hover)}
.seg label:has(input:checked){background:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

/* Display settings popover. */
.menu{position:relative}
.menu summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--radius);cursor:pointer;background:var(--panel)}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:var(--hover)}
.menu summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.menu[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.menu-body{position:absolute;right:0;top:calc(100% + 6px);z-index:20;width:250px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;gap:10px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:28px}
.check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}

.stage-wrap{position:relative;min-width:0;min-height:0}
.ss-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.ss-stage canvas{display:block;width:100%;height:100%;cursor:grab}
.ss-stage canvas:active{cursor:grabbing}
.ss-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ss-pin{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none}
.ss-pin span{display:block;padding:1px 6px;font-size:11px;line-height:1.5;background:rgba(255,255,255,.92);border:1px solid var(--line-strong);border-radius:4px;color:var(--ink)}
.ss-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.ss-loading[hidden]{display:none}
.hint{position:absolute;left:12px;top:10px;margin:0;font-size:12px;color:var(--muted);background:rgba(244,243,239,.85);padding:2px 8px;border-radius:4px;pointer-events:none}
.status{position:absolute;right:12px;top:10px;margin:0;max-width:min(560px,60%);font-size:12px;color:var(--muted);text-align:right;background:rgba(244,243,239,.85);padding:2px 8px;border-radius:4px;pointer-events:none}

/* Camera controls. */
.camera{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.icon-btn{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon-btn:hover{background:var(--hover)}
.btn-group{display:inline-flex}
.btn-group .icon-btn{border-radius:0;margin-left:-1px}
.btn-group .icon-btn:first-child{border-radius:var(--radius) 0 0 var(--radius);margin-left:0}
.btn-group .icon-btn:last-child{border-radius:0 var(--radius) var(--radius) 0}

/* Small table card: what is on the central table right now. */
.table-card{position:absolute;left:12px;bottom:12px;width:min(360px,calc(100% - 24px));padding:10px 12px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.table-card[hidden]{display:none}
.table-card .row1{display:flex;align-items:center;gap:8px}
.table-card .k{font-size:12px;color:var(--muted);white-space:nowrap}
.table-card select{flex:1;min-width:0;min-height:32px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel)}
.table-card .spec{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;margin-top:6px}
.table-card .dims{white-space:nowrap}
.table-card .dims{font-size:13px}
.table-card .price{font-size:14px;font-weight:700;white-space:nowrap}
.table-card .row3{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-size:11px;color:var(--muted)}
.link-btn{padding:0;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:12px;white-space:nowrap}
.link-btn:hover{color:#163d7a}

/* Comparison drawer, opened on demand. */
.drawer{position:absolute;top:12px;right:12px;bottom:60px;width:min(420px,calc(100% - 24px));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);z-index:10}
.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:14px;flex:1}
.sort{display:inline-flex;gap:2px;font-size:12px}
.sort button{border:0;background:none;padding:2px 6px;border-radius:4px;color:var(--muted);cursor:pointer}
.sort button[aria-pressed="true"]{color:var(--ink);font-weight:600;background:var(--hover)}
.close{border:0;background:none;width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.close:hover{background:var(--hover);color:var(--ink)}
.drawer-body{overflow:auto;min-height:0}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--hover)}
.row[aria-checked="true"]{background:var(--selected)}
.row .dot{width:14px;height:14px;border:1.5px solid var(--line-strong);border-radius:50%}
.row[aria-checked="true"] .dot{border:4px solid var(--accent)}
.row .t{font-weight:600;font-size:13px;line-height:1.35}
.row .s{font-size:12px;color:var(--muted)}
.row .p{font-size:13px;text-align:right;white-space:nowrap}
.row .p small{display:block;font-size:11px;color:var(--muted)}
.more{padding:0 12px 10px 38px;background:var(--selected);font-size:12px;color:var(--muted)}
.more dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.more dt{color:var(--faint)}
.more dd{margin:0;color:var(--ink)}
.more a{color:var(--accent)}
.drawer-foot{margin:0;padding:8px 12px;font-size:11px;color:var(--faint);border-top:1px solid var(--line)}

@media (max-width:760px){
  .top{padding:8px 12px;gap:8px 12px}
  .top .spacer{display:none}
  .top .ctl-label{display:none}
  .views{order:5;width:100%}
  .views .seg{width:100%}
  .views .seg label{flex:1;padding:0 4px}
  .menu-body{right:auto;left:0}
  .hint,.status{display:none}
  .camera{top:10px;bottom:auto;right:10px}
  .icon-btn{height:36px;min-width:36px;padding:0 8px}
  .table-card{left:8px;right:8px;bottom:8px;width:auto}
  .drawer{left:0;right:0;bottom:0;top:auto;width:auto;max-height:72%;border-radius:12px 12px 0 0}
}
</style>
</head>
<body>
<div class="app" id="ss-office-3d">
  <header class="top">
    <h1>東SSビル 6階 レイアウト</h1>
    <div class="ctl" role="radiogroup" aria-label="配置">
      <span class="ctl-label">配置</span>
      <span class="seg" id="ss-layout">
        <label><input type="radio" name="ss-layout" value="A">A 島型</label>
        <label><input type="radio" name="ss-layout" value="B" checked>B 壁寄せ</label>
      </span>
    </div>
    <div class="ctl views" role="radiogroup" aria-label="視点">
      <span class="ctl-label">視点</span>
      <span class="seg" id="ss-view">
        <label><input type="radio" name="ss-view" value="overview" checked>全体</label>
        <label><input type="radio" name="ss-view" value="top">真上</label>
        <label><input type="radio" name="ss-view" value="table">中央</label>
        <label><input type="radio" name="ss-view" value="inside">室内</label>
        <label><input type="radio" name="ss-view" value="reverse">入口を見る</label>
      </span>
    </div>
    <span class="spacer"></span>
    <details class="menu">
      <summary>表示</summary>
      <div class="menu-body">
        <div class="ctl" role="radiogroup" aria-label="床">
          <span class="ctl-label" style="display:inline">床</span>
          <span class="seg" id="ss-floor">
            <label><input type="radio" name="ss-floor" value="linoleum" checked>リノリウム</label>
            <label><input type="radio" name="ss-floor" value="carpet">カーペット</label>
          </span>
        </div>
        <label class="check"><input id="ss-power" type="checkbox" checked>電源の位置（9箇所・36口）</label>
        <label class="check"><input id="ss-laptops" type="checkbox">中央テーブルのノートPC（6台）</label>
        <label class="check"><input id="ss-walls" type="checkbox">外壁を透かす</label>
      </div>
    </details>
  </header>

  <main class="stage-wrap">
    <div class="ss-stage" role="img" aria-label="東SSビル6階の3Dモデル">
      <div class="ss-labels" aria-hidden="true"></div>
      <div class="ss-loading" role="status">3Dを読み込み中…</div>
    </div>
    <p class="hint">ドラッグで回転・ホイールで拡大縮小</p>
    <p class="status" id="ss-layout-label" aria-live="polite"></p>

    <div class="table-card" id="table-card">
      <div class="row1">
        <label class="k" for="table-select">中央テーブル</label>
        <select id="table-select"></select>
      </div>
      <div class="spec">
        <span class="dims num" id="card-dims"></span>
        <span class="price num" id="card-price"></span>
      </div>
      <div class="row3">
        <span id="card-basis"></span>
        <button type="button" class="link-btn" id="open-compare" aria-expanded="false" aria-controls="compare">候補を比べる</button>
      </div>
    </div>

    <section class="drawer" id="compare" hidden aria-labelledby="compare-h">
      <div class="drawer-head">
        <h2 id="compare-h">中央テーブルの候補</h2>
        <div class="sort" role="group" aria-label="並び順">
          <button type="button" data-sort="price" aria-pressed="true">価格順</button>
          <button type="button" data-sort="area" aria-pressed="false">大きさ順</button>
        </div>
        <button type="button" class="close" id="close-compare" aria-label="閉じる">×</button>
      </div>
      <div class="drawer-body"><ul class="ledger" id="ledger" role="radiogroup" aria-label="中央テーブルの候補"></ul></div>
      <p class="drawer-foot">価格は2026年10月時点の公開情報。寸法は幅×奥行×高さ（mm）。</p>
    </section>

    <div class="camera" role="group" aria-label="カメラ操作">
      <span class="btn-group">
        <button type="button" class="icon-btn" id="ss-left" aria-label="左へ回す">↶</button>
        <button type="button" class="icon-btn" id="ss-right" aria-label="右へ回す">↷</button>
      </span>
      <span class="btn-group">
        <button type="button" class="icon-btn" id="ss-far" aria-label="縮小">−</button>
        <button type="button" class="icon-btn" id="ss-near" aria-label="拡大">＋</button>
      </span>
      <button type="button" class="icon-btn" id="ss-reset">視点を戻す</button>
    </div>
  </main>
</div>
<script>
(async()=>{
const root=document.getElementById('ss-office-3d');
const stage=root.querySelector('.ss-stage'), overlay=root.querySelector('.ss-labels');
try{
const [THREE,{OrbitControls},{RoomEnvironment}]=await Promise.all([
  import('https://esm.sh/three@0.180.0'),
  import('https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js'),
  import('https://esm.sh/three@0.180.0/examples/jsm/environments/RoomEnvironment.js')
]);
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
stage.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(42,1,.04,100);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=false;controls.maxPolarAngle=Math.PI*.49;
controls.minDistance=.6;controls.maxDistance=32;
controls.listenToKeyEvents(window);
const pmrem=new THREE.PMREMGenerator(renderer);
const environment=new RoomEnvironment();
scene.environment=pmrem.fromScene(environment,.04).texture;
scene.environmentIntensity=.3;environment.dispose();pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xe4edff,0x77746f,1.2));
const sunlight=new THREE.DirectionalLight(0xfff7ee,1.8);
sunlight.position.set(-7,12,-1);sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);sunlight.shadow.camera.left=-8;
sunlight.shadow.camera.right=8;sunlight.shadow.camera.top=9;sunlight.shadow.camera.bottom=-9;
sunlight.shadow.normalBias=.025;sunlight.shadow.bias=-.00015;
sunlight.shadow.radius=3;scene.add(sunlight);
const fill=new THREE.DirectionalLight(0xe2eaff,.8);fill.position.set(8,8,7);scene.add(fill);
const model=new THREE.Group();model.name='東SSビル6階';scene.add(model);
const outer=new THREE.Group();outer.name='外壁';model.add(outer);
const frontHigh=new THREE.Group();frontHigh.name='南壁上部';model.add(frontHigh);
const ceiling=new THREE.Group();ceiling.name='天井';model.add(ceiling);ceiling.visible=false;
const surroundings=new THREE.Group();surroundings.name='窓外';model.add(surroundings);surroundings.visible=false;
const powerGroup=new THREE.Group();powerGroup.name='電源9点';model.add(powerGroup);
const meetingGroup=new THREE.Group();meetingGroup.name='Aの会議テーブルと4脚';model.add(meetingGroup);
const roundGroup=new THREE.Group();roundGroup.name='Bの中央テーブル';model.add(roundGroup);
const layoutShadows={A:new THREE.Group(),B:new THREE.Group()};model.add(layoutShadows.A,layoutShadows.B);
const pins=[];
let seed=12903;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function texture(kind){
 const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');const img=ctx.createImageData(512,512);
 for(let y=0;y<512;y++)for(let x=0;x<512;x++){
  const i=(y*512+x)*4;let r,g,b;
  if(kind==='mahogany'){const grain=Math.sin(y*.32+Math.sin(x*.016)*1.8)*8+Math.sin(y*.089+x*.007)*5+(rand()-.5)*11;r=138+grain;g=64+grain*.62;b=39+grain*.42}
  else if(kind==='wood'){const grain=Math.sin(y*.43+Math.sin(x*.021)*1.3)*5+(rand()-.5)*9;r=211+grain;g=184+grain;b=145+grain}
  else if(kind==='carpet'){
   const flip=(Math.floor(x/256)+Math.floor(y/256))%2;
   const weave=Math.sin((flip?x:y)*2.1)*3.5;
   const grain=(rand()-.5)*47+weave+Math.sin(x*.07)*Math.sin(y*.07)*2;
   const seam=x%256<1||y%256<1?5:0;
   r=102+grain+flip*2-seam;g=106+grain+flip*2-seam;b=114+grain+flip*2-seam;
  }else if(kind==='ceiling'){
   const grain=(rand()-.5)*7-(rand()<.026?14:0)-(x<1||y<1?14:0);
   r=223+grain;g=223+grain;b=216+grain;
  }else{const grain=(rand()-.5)*6;r=232+grain;g=230+grain;b=222+grain}
  img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255;
 }
 ctx.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;
}
const carpetTex=texture('carpet');carpetTex.repeat.set(1,1);
const woodTex=texture('wood');woodTex.repeat.set(1,1);
const mahoganyTex=texture('mahogany');
const wallTex=texture('wall'),ceilingTex=texture('ceiling');
const mat=(color,roughness=.7,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const M={wall:new THREE.MeshStandardMaterial({map:wallTex,roughness:.95,bumpMap:wallTex,bumpScale:.002}),ceiling:new THREE.MeshStandardMaterial({map:ceilingTex,roughness:1,bumpMap:ceilingTex,bumpScale:.003}),trim:mat(0x3c4140,.75),black:mat(0x171d1c,.43,.18),metal:mat(0xa6acac,.3,.65),white:mat(0xeeeee9,.6),door:mat(0xa6a398,.62,.1),blind:mat(0xbcc0bd,.66,.22),screen:mat(0x11191f,.4),red:mat(0xd8422c,.35,.35),wood:new THREE.MeshStandardMaterial({map:woodTex,roughness:.67}),carpet:new THREE.MeshStandardMaterial({map:carpetTex,bumpMap:carpetTex,bumpScale:.014,roughness:1}),stone:mat(0xa4a6a5,1),dark:mat(0x32383d,.9),fridge:mat(0x616668,.32,.65),pad:mat(0x292d30,.95)};
M.mahogany=new THREE.MeshStandardMaterial({map:mahoganyTex,roughness:.49});
const glass=new THREE.MeshPhysicalMaterial({color:0xc9dce1,transparent:true,opacity:.12,roughness:.12,metalness:.08,side:THREE.DoubleSide,depthWrite:false});
function box(parent,w,h,d,x,y,z,material,name){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);mesh.castShadow=material!==glass;mesh.receiveShadow=true;mesh.name=name||'';parent.add(mesh);return mesh}
function rod(parent,a,b,r,material){const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b),delta=bv.clone().sub(av);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,delta.length(),8),material);mesh.position.copy(av).add(bv).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());mesh.castShadow=true;parent.add(mesh);return mesh}
function curve(parent,points,r,material){const c=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,20,r,5,false),material);parent.add(mesh);return mesh}
function group(name,x,z,rot=0,parent=model){const g=new THREE.Group();g.name=name;g.position.set(x-3.35,0,z-4);g.rotation.y=rot;parent.add(g);return g}
function W(parent,w,h,d,x,y,z,m,name){return box(parent,w,h,d,x-3.35,y,z-4,m,name)}
function lineWall(parent,x1,z1,x2,z2,h=2.6,bottom=0,m=M.wall,t=.12){const length=Math.hypot(x2-x1,z2-z1);const mesh=W(parent,length,h,t,(x1+x2)/2,bottom+h/2,(z1+z2)/2,m);mesh.rotation.y=-Math.atan2(z2-z1,x2-x1);return mesh}
function floor(parent,points,m,thickness=.16){const shape=new THREE.Shape();points.forEach(([x,z],i)=>{const p=[x-3.35,4-z];if(i===0)shape.moveTo(...p);else shape.lineTo(...p)});shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:thickness,bevelEnabled:false});geo.rotateX(-Math.PI/2);geo.translate(0,-thickness,0);const pos=geo.attributes.position,uv=geo.attributes.uv;for(let i=0;i<pos.count;i++)uv.setXY(i,pos.getX(i),pos.getZ(i));const mesh=new THREE.Mesh(geo,m);mesh.receiveShadow=true;parent.add(mesh);return mesh}
const sx=6.905/664,sz=8.3/810;
const xy=(x,z)=>[(x-1849)*sx,(z-432)*sz];
const outline=[[1845,515],[2056,515],[2056,485],[2070,485],[2070,480],[2197,480],[2197,485],[2313,485],[2313,480],[2421,480],[2421,495],[2490,495],[2500,1161],[2443,1161],[2443,1228],[1930,1228],[1930,1162],[1845,1162]].map(p=>xy(...p));
// Continuous matte sheet floor; approximate off-white, not a manufacturer swatch.
const sheetCanvas=document.createElement('canvas');sheetCanvas.width=sheetCanvas.height=256;

 laptops.forEach((g,i)=>{const side=i<3?-1:1;g.position.x=side*option.laptopX;g.position.z=option.laptopZ[i%3]});
 const [w,d]=option.mm;tableDimensionPin.el.firstElementChild.textContent=option.shape==='round'?`φ${fmt(w)}`:`${fmt(w)}×${fmt(d)}`;
 tableDimensionPin.pos.z=option.pinZ;
 renderCard();if(!drawer.hidden)renderLedger();updateLabel();render();
}
function updateCartCable(z,h){
 while(cartCables.children.length){const mesh=cartCables.children[0];cartCables.remove(mesh);mesh.geometry.dispose()}
 // Power from the rear of the small cart down to the nearest northern tap, T7.
 const cable=curve(cartCables,[[-.14,h-.04,z-.18],[-.18,h*.55,z-.22],[-.20,.05,z-.25],[-.18,.012,z-.30],[-.15,.012,-2.10],[-.06,.012,-2.15],[0,.042,-2.15]],.006,M.black);cable.name='北側T7への延長ケーブル';
 box(cartCables,.022,.016,.042,0,.047,-2.15,M.black,'T7に差したプラグ');
 box(cartCables,.28,.026,.052,0,h-.04,z-.18,M.white,'ワゴン背面の電源タップ');
 for(let i=0;i<4;i++)for(const d of [-.008,.008])box(cartCables,.008,.002,.003,-.10+i*.067,h-.026,z-.18+d,M.dark);
 curve(cartCables,[[.08,h+.23,z-.06],[.09,h+.08,z-.15],[.10,h-.02,z-.20],[.07,h-.026,z-.18]],.0035,M.black).name='モニターの電源ケーブル';
 const phoneY=.08+.347*(h-.08)/.64;
 curve(cartCables,[[.02,phoneY+.01,z+.01],[.13,phoneY+.008,z-.15],[.16,phoneY+.05,z-.21],[.10,h-.026,z-.18]],.003,M.black).name='中段の電話の充電ケーブル';
}
function setLaptops(show){laptopToggle.checked=!!show;equipment.visible=!!show;updateLabel();render()}
function setFloor(next){floorFinish=next==='carpet'?'carpet':'linoleum';officeFloor.material=floorFinish==='carpet'?M.carpet:sheetMaterial;floorGroup.querySelectorAll('input').forEach(input=>input.checked=input.value===floorFinish);render()}
function interior(){return view==='inside'||view==='reverse'}
function projectPins(){const w=stage.clientWidth,h=stage.clientHeight;for(const p of pins){const v=p.pos.clone().project(camera);p.el.hidden=(p.power&&!powerToggle.checked)||(p.layout&&p.layout!==layout)||interior()||v.z>1||v.z< -1||Math.abs(v.x)>.97||Math.abs(v.y)>.96;p.el.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px) translate(-50%,-100%)`}}
function render(){renderer.render(scene,camera);projectPins();root.dataset.layout=layout;root.dataset.tableModel=layout==='B'?tableChoice:'';root.dataset.laptops=String(equipment.visible)}
function updateLabel(){
 layoutLabel.textContent=layout==='B'
  ?`配置B：デスク 西3台・東4台／北側ワゴンに50インチ画面・電話／ノートPC ${equipment.visible?'表示':'非表示'}`
  :'配置A：デスク7台の島／会議テーブル RUGHAUS 1,750×800と会議チェア4脚';
 stage.setAttribute('aria-label',`東SSビル6階・${layoutLabel.textContent}。フォンブース2台、冷蔵庫、食品棚、ゴミ箱3個、バンカーズボックス16個、北壁の時計、簡易ハンガーラック、電源9箇所。`);
}
function setLayout(next){layout=next==='A'?'A':'B';layoutGroup.querySelectorAll('input').forEach(input=>input.checked=input.value===layout);trashBins.forEach((g,i)=>{const [x,z]=binLayouts[layout][i];g.position.set(x-3.35,0,z-4);g.rotation.y=layout==='B'?Math.PI/2:0});deskObjects.forEach((g,i)=>{const [x,z,r]=deskLayouts[layout][i];g.position.set(x-3.35,0,z-4);g.rotation.y=r});meetingGroup.visible=layout==='A';roundGroup.visible=layout==='B';layoutShadows.A.visible=layout==='A';layoutShadows.B.visible=layout==='B';
 if(layout!=='B')openCompare(false);
 renderCard();updateLabel();if(view==='table')setView('table');else render()}
function wallTransparency(){outer.traverse(o=>{if(!o.isMesh)return;if(o.material===glass)return;if(!o.userData.original)o.userData.original=o.material;o.material=wallToggle.checked?o.userData.original.clone():o.userData.original;if(wallToggle.checked){o.material.transparent=true;o.material.opacity=.13;o.material.depthWrite=false;o.castShadow=false}else o.castShadow=true});render()}
function setView(next){view=['overview','inside','reverse','top','table'].includes(next)?next:'overview';viewGroup.querySelectorAll('input').forEach(input=>input.checked=input.value===view);ceiling.visible=interior();frontHigh.visible=interior();surroundings.visible=interior();camera.fov=interior()?72:42;camera.updateProjectionMatrix();
 if(view==='overview'){camera.position.set(.6,9.1,10.4);controls.target.set(0,.55,-.35);controls.maxPolarAngle=Math.PI*.49}
 if(view==='inside'){camera.position.set(.25,1.6,2.25);controls.target.set(-.25,1.35,-2.5);controls.maxPolarAngle=Math.PI*.72}
 if(view==='reverse'){camera.position.set(-2.25,1.6,-2.15);controls.target.set(.45,1.30,2.60);controls.maxPolarAngle=Math.PI*.72}
 if(view==='table'){camera.position.set(layout==='B'?1.9:1,1.85,layout==='B'?2.4:1.05);controls.target.set(layout==='B'?0:1.95,.62,layout==='B'?-.30:-1.475);controls.maxPolarAngle=Math.PI*.49}
 if(view==='top'){camera.position.set(0,16.8,.02);controls.target.set(0,0,-.32);controls.maxPolarAngle=Math.PI*.49}
 lastFit=1;resize();controls.update();render();
}
function save(){store.set({view,layout,tableChoice,floorFinish,sortKey,power:powerToggle.checked,walls:wallToggle.checked,laptops:laptopToggle.checked})}
floorGroup.addEventListener('change',e=>{setFloor(e.target.value);save()});
layoutGroup.addEventListener('change',e=>{setLayout(e.target.value);save()});
viewGroup.addEventListener('change',e=>{setView(e.target.value);save()});
select.addEventListener('change',()=>{setTable(select.value);save()});
openBtn.addEventListener('click',()=>openCompare(drawer.hidden));
$('#close-compare').addEventListener('click',()=>{openCompare(false);openBtn.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!drawer.hidden){openCompare(false);openBtn.focus()}root.querySelector('.menu[open]')?.removeAttribute('open')}});
document.addEventListener('click',e=>{const m=root.querySelector('.menu[open]');if(m&&!m.contains(e.target))m.removeAttribute('open')});
ledger.addEventListener('click',e=>{const b=e.target.closest('.row');if(!b)return;setTable(b.dataset.key);ledger.querySelector(`[data-key="${b.dataset.key}"]`).focus();save()});
ledger.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const rows=[...ledger.querySelectorAll('.row')];const i=rows.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=rows[(i+(e.key==='ArrowDown'?1:-1)+rows.length)%rows.length];n.click()});
root.querySelectorAll('.sort button').forEach(b=>b.addEventListener('click',()=>{sortKey=b.dataset.sort;renderLedger();save()}));
laptopToggle.addEventListener('change',()=>{setLaptops(laptopToggle.checked);save()});
powerToggle.addEventListener('change',()=>{render();save()});wallToggle.addEventListener('change',()=>{wallTransparency();save()});
controls.addEventListener('change',render);
function turn(angle){camera.position.sub(controls.target).applyAxisAngle(new THREE.Vector3(0,1,0),angle).add(controls.target);controls.update();render()}
function zoom(factor){const offset=camera.position.clone().sub(controls.target);offset.setLength(Math.min(controls.maxDistance,Math.max(controls.minDistance,offset.length()*factor)));camera.position.copy(controls.target).add(offset);controls.update();render()}
$('#ss-left').addEventListener('click',()=>turn(-Math.PI/8));
$('#ss-right').addEventListener('click',()=>turn(Math.PI/8));
$('#ss-near').addEventListener('click',()=>zoom(.8));
$('#ss-far').addEventListener('click',()=>zoom(1.25));
$('#ss-reset').addEventListener('click',()=>setView(view));
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();camera.fov=view==='table'?(w<600?64:42):(interior()?72:42);camera.updateProjectionMatrix();const fit=interior()||view==='table'?1:Math.max(1,(w<600?.9:1.15)/(w/h));camera.position.sub(controls.target).multiplyScalar(fit/lastFit).add(controls.target);lastFit=fit;render()}
new ResizeObserver(resize).observe(stage);
const saved=store.get()||{};
sortKey=saved.sortKey==='area'?'area':'price';
powerToggle.checked=saved.power!==false;wallToggle.checked=!!saved.walls;
setFloor(saved.floorFinish);
setTable(saved.tableChoice);
setLaptops(saved.laptops===true);
setLayout(saved.layout==='A'?'A':'B');
setView(saved.view);
wallTransparency();
root.querySelector('.ss-loading').hidden=true;
root.dataset.ready='true';
root.__scene={scene,model,camera,controls,renderer,tableMeshes,equipment,mediaCart,cartCables,deskObjects,trashBins,storageBoxes,wallClock,hangerRack};
render();
}catch(err){root.querySelector('.ss-loading').textContent='3Dの読み込みに失敗しました。ページを再読み込みしてください。';console.error(err)}
})();
</script>
</body>
</html>
